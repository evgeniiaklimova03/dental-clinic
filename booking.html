<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Запись на консультацию — Стоматология "Белая Гавань"</title>
    <meta name="description" content="Запишитесь на консультацию в премиальную стоматологию &quot;Белая Гавань&quot; в Москве. Быстрая запись, внимательные врачи.">

    <!-- Open Graph -->
    <meta property="og:title" content="Запись на консультацию — Стоматология &quot;Белая Гавань&quot;">
    <meta property="og:description" content="Запишитесь на консультацию в премиальную стоматологию &quot;Белая Гавань&quot; в Москве. Быстрая запись, внимательные врачи.">
    <meta property="og:image" content="https://dental-clinic-mvvb.netlify.app/images/clinic.jpg">
    <meta property="og:url" content="https://dental-clinic-mvvb.netlify.app/booking.html">
    <meta property="og:type" content="website">

    <!-- Подключение шрифтов Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

    <!-- Подключение CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- ШАПКА САЙТА (HEADER) -->
    <header class="header">
        <div class="container header__container">
            <a href="index.html" class="header__logo">Белая Гавань</a>
            <nav class="header__nav">
                <a href="index.html" class="header__link">Услуги</a>
                <a href="index.html" class="header__link">О клинике</a>
                <a href="index.html" class="header__link">Врачи</a>
                <a href="index.html" class="header__link">Цены</a>
                <a href="index.html" class="header__link">Контакты</a>
            </nav>
            <a href="booking.html" class="btn btn--primary">Записаться</a>
            <button class="header__burger" aria-label="Открыть меню" aria-expanded="false">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </header>

    <!-- ОСНОВНОЙ КОНТЕНТ (MAIN) -->
    <main class="main">
        <section class="booking">
            <div class="container">
                <div class="booking__card">
                    <h1 class="booking__title">Запись на консультацию</h1>
                    <p class="booking__subtitle">Оставьте заявку, и мы перезвоним вам в ближайшее время.</p>

                    <form class="booking-form" action="https://formspree.io/f/meagpwge" method="POST">
                        <input type="hidden" name="_next" value="https://dental-clinic-mvvb.netlify.app/thanks.html">
                        <div class="booking-form__row">
                            <div class="booking-form__group">
                                <label class="booking-form__label" for="name">Ваше имя</label>
                                <input class="booking-form__input" type="text" id="name" name="name" placeholder="Иван Иванов" required>
                            </div>
                            <div class="booking-form__group">
                                <label class="booking-form__label" for="phone">Телефон</label>
                                <input class="booking-form__input" type="tel" id="phone" name="phone" placeholder="+7 (___) ___-__-__" required>
                            </div>
                        </div>

                        <div class="booking-form__group">
                            <label class="booking-form__label" for="service">Интересующая услуга</label>
                            <select class="booking-form__input" id="service" name="service">
                                <option value="Имплантация">Имплантация</option>
                                <option value="Эстетическая стоматология">Эстетическая стоматология</option>
                                <option value="Ортодонтия">Ортодонтия</option>
                                <option value="Лечение зубов">Лечение зубов</option>
                            </select>
                        </div>

                        <label class="booking-form__checkbox">
                            <input type="checkbox" name="consent" required>
                            <span>Я согласен(на) на обработку персональных данных и ознакомлен(а) с <a href="#">политикой конфиденциальности</a></span>
                        </label>

                        <button type="submit" class="btn btn--primary booking-form__submit">Отправить заявку</button>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <!-- ПОДВАЛ (FOOTER) -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2024 Стоматология "Белая Гавань". Все права защищены.</p>
        </div>
    </footer>

    <!-- Подключение JavaScript -->
    <script src="js/script.js"></script>

</body>
</html>
